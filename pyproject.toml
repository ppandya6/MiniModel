[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimodel"
version = "0.1.0"
description = "A small, inspectable autoregressive transformer research lab"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3"]

[project.scripts]
minimodel = "minimodel.cli:main"

[tool.setuptools.packages.find]
include = ["minimodel*"]
